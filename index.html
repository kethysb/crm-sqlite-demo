<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM com SQLite | Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#142536;font:16px/1.5 system-ui,sans-serif}header{background:#16304a;color:#fff;padding:2.5rem max(1.25rem,calc((100% - 68rem)/2))}h1,h2,p{margin:0 0 .6rem}main{max-width:70rem;margin:auto;padding:1.25rem}.panel{background:#fff;border:1px solid #dbe2e9;border-radius:12px;padding:1.25rem;margin-bottom:1rem}form{display:flex;flex-wrap:wrap;gap:.8rem;align-items:end}label{display:grid;gap:.25rem;font-weight:600}input,select,button{font:inherit;padding:.5rem .7rem;border:1px solid #8597a7;border-radius:6px;background:#fff;color:inherit}button{background:#164f65;color:#fff;border-color:transparent;cursor:pointer}button.remove{background:#fff;color:#98283d;border-color:#cfa7af}.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem}.list{display:grid;gap:.6rem;padding:0;list-style:none}.list li{display:flex;flex-wrap:wrap;align-items:center;gap:.65rem;padding:.75rem;border:1px solid #dbe2e9;border-radius:8px}.lead{flex:1;min-width:13rem;overflow-wrap:anywhere}.lead span{display:block;color:#405469}.due{color:#98283d;font-weight:700}.muted{font-size:.92rem}
</style>
</head>
<body>
<header><h1>CRM com SQLite</h1><p>Gerencie oportunidades e retornos com armazenamento em SQLite.</p></header>
<main>
<section class="panel" aria-labelledby="new"><h2 id="new">Nova oportunidade</h2><p class="muted">Demo de portfólio. Use apenas dados fictícios.</p>
<form id="add">
<label>Oportunidade <input name="title" required maxlength="100" placeholder="Ex. Projeto Demo"></label>
<label>Etapa <select name="stage" id="stage"></select></label>
<label>Próximo retorno <input type="date" name="date" required></label>
<button>Adicionar</button>
</form><p role="status" id="feedback"></p></section>
<section class="panel" aria-labelledby="pipeline"><div class="top"><h2 id="pipeline">Oportunidades</h2>
<label>Exibir <select id="filter"><option value="all">Todas</option><option value="due">Retornos até hoje</option></select></label></div>
<p id="summary" aria-live="polite"></p><ul id="leads" class="list"></ul></section>
</main>
<script>
const stages = ['Novo contato', 'Qualificação', 'Proposta enviada', 'Fechado'];
function localDate(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  const pad = n => String(n).padStart(2, '0');
  return [d.getFullYear(), pad(d.getMonth() + 1), pad(d.getDate())].join('-');
}
const form = document.querySelector('#add');
const feedback = document.querySelector('#feedback');
const filter = document.querySelector('#filter');
const list = document.querySelector('#leads');
let leads = [];
async function request(method, path, data) {
  const response = await fetch(path, {
    method,
    ...(data && {headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)})
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.erro || 'A operação falhou.');
  return result;
}
async function refresh() {
  leads = await request('GET', '/api/leads');
  render();
}
async function save(method, path, data, message) {
  try {
    await request(method, path, data);
    await refresh();
    feedback.textContent = message;
    return true;
  } catch (error) {
    feedback.textContent = error.message;
    render();
    return false;
  }
}
function fillStages(select, selected) {
  for (const stage of stages) select.add(new Option(stage, stage, false, stage === selected));
}
function isDue(lead) { return lead.stage !== 'Fechado' && lead.date <= localDate(); }
function render() {
  list.replaceChildren();
  const dueCount = leads.filter(isDue).length;
  document.querySelector('#summary').textContent = leads.length + ' no total · ' + dueCount + ' com retorno até hoje';
  const visible = filter.value === 'due' ? leads.filter(isDue) : leads;
  for (const lead of [...visible].sort((a, b) => a.date.localeCompare(b.date))) {
    const row = document.createElement('li');
    const details = document.createElement('div');
    details.className = 'lead';
    const title = document.createElement('strong');
    title.textContent = lead.title;
    const deadline = document.createElement('span');
    deadline.textContent = 'Retorno ' + lead.date.split('-').reverse().join('/');
    if (isDue(lead)) deadline.className = 'due';
    details.append(title, deadline);
    const stage = document.createElement('select');
    stage.setAttribute('aria-label', 'Etapa de ' + lead.title);
    fillStages(stage, lead.stage);
    stage.addEventListener('change', () => {
      stage.disabled = true;
      save('PATCH', '/api/leads/' + lead.id, {...lead, stage: stage.value}, 'Etapa atualizada.');
    });
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'remove';
    remove.textContent = 'Excluir';
    remove.setAttribute('aria-label', 'Excluir ' + lead.title);
    remove.addEventListener('click', () => {
      remove.disabled = true;
      save('DELETE', '/api/leads/' + lead.id, null, 'Oportunidade excluída.');
    });
    row.append(details, stage, remove);
    list.append(row);
  }
  if (!visible.length) {
    const empty = document.createElement('li');
    empty.textContent = 'Nenhuma oportunidade neste filtro.';
    list.append(empty);
  }
}
fillStages(document.querySelector('#stage'), stages[0]);
form.elements.date.value = localDate();
form.addEventListener('submit', async event => {
  event.preventDefault();
  const data = new FormData(form);
  const title = data.get('title').trim();
  if (!title) { feedback.textContent = 'Informe o nome da oportunidade.'; return; }
  const submit = form.querySelector('button');
  submit.disabled = true;
  const added = await save('POST', '/api/leads', {title, stage: data.get('stage'), date: data.get('date')}, 'Oportunidade adicionada.');
  if (added) {
    form.reset();
    form.elements.date.value = localDate();
  }
  submit.disabled = false;
});
filter.addEventListener('change', render);
refresh().catch(error => { feedback.textContent = error.message; });
</script>
</body>
</html>
